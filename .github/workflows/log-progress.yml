name: 🚀 Auto Daily ML Logger

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  process-daily-log:
    # Only run for daily log issues or manual dispatch
    if: contains(github.event.issue.labels.*.name, 'daily-log') || startsWith(github.event.issue.title, '[Log]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Process Log & Update README
        id: process_log
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python .github/scripts/process_log.py

      - name: 🚀 Commit & Push Daily Progress
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add logs/ README.md
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(log): ${{ steps.process_log.outputs.day_str }} - ${{ steps.process_log.outputs.topic }} 🚀 [skip ci]"
            git push
          fi

      - name: 💬 Comment on Issue & Close
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const day = "${{ steps.process_log.outputs.day_str }}";
            const topic = "${{ steps.process_log.outputs.topic }}";
            const streak = "${{ steps.process_log.outputs.streak }}";
            const total = "${{ steps.process_log.outputs.total_days }}";
            const fileName = "${{ steps.process_log.outputs.file_name }}";

            const commentBody = `### 🎉 ${day} Successfully Logged!
            
            Great job on learning **${topic}** today! 🧠✨
            
            - 📁 **Note File:** [\`${fileName}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/logs/${fileName})
            - 🔥 **Current Streak:** \`${streak} Days\`
            - 🎯 **Total Days Logged:** \`${total} Days\`
            - 📊 **Dashboard:** Updated in [README.md](https://github.com/${context.repo.owner}/${context.repo.repo}#readme)
            
            Keep up the amazing consistency! See you tomorrow! 🚀`;

            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

            // Add logged label and close
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['logged', 'completed']
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
